<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>회계관리</title>
<link rel="stylesheet" href="css/style.css?v=202609181643">
<script>document.documentElement.setAttribute("data-theme", localStorage.getItem("erpTheme") === "dark" ? "dark" : "light");</script>
</head>
<body>
<div class="app-shell">
  <aside class="app-sidebar">
    <a class="app-brand" href="index.html"><span class="app-brand-text" data-i18n="moduleName"></span></a>

    <div class="app-nav-label" data-i18n="navSecMain"></div>
    <a class="app-nav-item" href="index.html">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <span class="app-nav-text" data-i18n="navQuery"></span>
    </a>
    <a class="app-nav-item" href="submit.html">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      <span class="app-nav-text" data-i18n="navSubmit"></span>
    </a>

    <div class="app-nav-label" data-i18n="navSecAdmin"></div>
    <a class="app-nav-item active" href="admin.html">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 4v5c0 4.4-3.4 8.2-8 9-4.6-.8-8-4.6-8-9V7z"/></svg>
      <span class="app-nav-text" data-i18n="navAdminShort"></span>
    </a>

    <div class="app-sidebar-foot">
      <button class="app-theme-btn" id="themeToggle" aria-label="theme"></button>
      <button class="lang-btn" data-lang="ko">한</button>
      <button class="lang-btn" data-lang="zh">中</button>
    </div>
  </aside>

  <div class="app-main">
    <header class="topbar">
      <h1 data-i18n="appTitle"></h1>
      <nav class="nav-links">
        <a href="https://hyeongk215-boot.github.io/monthly-management-system/" data-i18n="navDashboard">← 통합 대시보드</a>
      </nav>
    </header>
<main>
  <div class="card">
    <h2 data-i18n="adminHeading"></h2>
    <p class="desc" data-i18n="adminDesc"></p>
    <div class="form-grid">
      <div>
        <label data-i18n="adminKeyLabel"></label>
        <input type="password" id="adminKey">
      </div>
      <div>
        <label data-i18n="adminYm"></label>
        <select id="adminYm"></select>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn-primary" id="fetchBtn" data-i18n="adminFetch"></button>
    </div>

    <div class="btn-row" style="align-items:center;">
      <span data-i18n="adminMonthStatus"></span>:
      <span class="badge" id="monthStatusBadge"></span>
      <button class="btn-danger" id="closeMonthBtn"></button>
    </div>

    <div class="tab-bar" style="margin-top:22px;">
      <button class="tab-btn tab-active" id="viewByOfficeBtn" data-i18n="viewByOffice"></button>
      <button class="tab-btn" id="viewConsolidatedBtn" data-i18n="viewConsolidated"></button>
    </div>

    <div id="byOfficeSection">
      <h3 data-i18n="adminStatusHeading" style="font-size:15px; margin-top:22px;"></h3>
      <p class="desc" data-i18n="adminFilterHint" style="margin-bottom:6px;"></p>
      <label style="font-size:13px; display:inline-flex; align-items:center; gap:6px; margin-bottom:8px;">
        <input type="checkbox" id="missingOnlyCheckbox"><span data-i18n="adminMissingOnlyLabel"></span>
      </label>
      <div class="status-grid" id="statusGrid"></div>
      <div class="btn-row" id="filterAllWrap" style="display:none;">
        <button class="btn-secondary" id="filterAllBtn" data-i18n="adminFilterAll"></button>
      </div>

      <h3 data-i18n="rateSectionHeading" style="font-size:15px; margin-top:22px;"></h3>
      <div class="rate-box">
        <span data-i18n="rateCurrentLabel"></span>: <b id="currentRate">-</b>
        <input type="number" step="0.01" id="rateInput" data-i18n-placeholder="rateInputLabel" style="max-width:220px;">
        <button class="btn-secondary" id="setRateBtn" data-i18n="rateSetBtn"></button>
      </div>

      <h3 data-i18n="aggHeading" style="font-size:15px; margin-top:22px;"></h3>
      <div class="summary-bar">
        <div><span data-i18n="totalRows"></span>: <b id="totalRows">0</b></div>
      </div>
      <div class="table-wrap">
        <table class="exp-table" id="previewTable">
          <thead>
            <tr>
              <th>#</th>
              <th data-i18n="colCorp"></th>
              <th data-i18n="colOffice"></th>
              <th data-i18n="colStatementType"></th>
              <th data-i18n="colAccount"></th>
              <th data-i18n="colAmountCny"></th>
              <th data-i18n="colAmountKrw"></th>
              <th data-i18n="colSubmittedBy"></th>
              <th data-i18n="colSubmittedAt"></th>
              <th><span data-i18n="colDelete"></span> <input type="checkbox" id="selectAllCheckbox"></th>
            </tr>
          </thead>
          <tbody id="previewBody"></tbody>
        </table>
      </div>
      <div class="btn-row">
        <button class="btn-primary" id="downloadBtn" data-i18n="adminDownload"></button>
        <button class="btn-danger" id="deleteSelectedBtn" data-i18n="adminDeleteSelectedBtn"></button>
      </div>
    </div>

    <div id="consolidatedSection" style="display:none;">
      <p class="desc" data-i18n="consolidatedDesc" style="margin-top:22px;"></p>
      <div class="form-grid">
        <div>
          <label data-i18n="corp"></label>
          <select id="consolCorp"></select>
        </div>
      </div>
      <div class="btn-row">
        <button class="btn-primary" id="consolFetchBtn" data-i18n="adminFetch"></button>
        <button class="btn-secondary" id="consolDownloadBtn" data-i18n="adminDownload"></button>
      </div>

      <div class="report-sheet" id="consolPlSheet">
        <div class="report-title" data-i18n="reportPlTitle"></div>
        <div class="report-meta">
          <span id="consolPlMetaCorp"></span>
          <span id="consolPlMetaYm"></span>
        </div>
        <div class="table-wrap">
          <table class="exp-table report-table" id="consolPlTable">
            <thead><tr>
              <th data-i18n="colLineNo"></th><th data-i18n="colAccount"></th>
              <th data-i18n="consolCurrentMonth"></th><th data-i18n="consolYtd"></th>
            </tr></thead>
            <tbody id="consolPlBody"></tbody>
          </table>
        </div>
      </div>

      <div class="report-sheet" id="consolBsSheet">
        <div class="report-title" data-i18n="reportBsTitle"></div>
        <div class="report-meta">
          <span id="consolBsMetaCorp"></span>
          <span id="consolBsMetaYm"></span>
        </div>
        <div class="table-wrap">
          <table class="exp-table report-table" id="consolBsTable">
            <thead><tr>
              <th data-i18n="colAccount"></th><th data-i18n="colLineNo"></th>
              <th data-i18n="consolCurrentBalance"></th><th data-i18n="consolPriorYearEnd"></th>
              <th data-i18n="colAccount"></th><th data-i18n="colLineNo"></th>
              <th data-i18n="consolCurrentBalance"></th><th data-i18n="consolPriorYearEnd"></th>
            </tr></thead>
            <tbody id="consolBsBody"></tbody>
          </table>
        </div>
      </div>

      <div class="report-sheet" id="consolCfSheet">
        <div class="report-title" data-i18n="reportCfTitle"></div>
        <div class="report-meta">
          <span id="consolCfMetaCorp"></span>
          <span id="consolCfMetaYm"></span>
        </div>
        <div class="table-wrap">
          <table class="exp-table report-table" id="consolCfTable">
            <thead><tr>
              <th data-i18n="colLineNo"></th><th data-i18n="colAccount"></th>
              <th data-i18n="consolCurrentMonth"></th><th data-i18n="consolYtd"></th>
            </tr></thead>
            <tbody id="consolCfBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <div class="card">
    <h2 data-i18n="coaHeading" style="font-size:18px;"></h2>
    <p class="desc" data-i18n="coaDesc"></p>
    <div class="note-box" id="coaAdminOnlyNote" data-i18n="coaSystemAdminOnly" style="display:none;"></div>
    <div class="btn-row" style="align-items:center;">
      <button class="btn-secondary" id="coaTemplateBtn" data-i18n="coaDownloadTemplateBtn"></button>
      <input type="file" id="coaFile" accept=".xlsx">
      <button class="btn-primary" id="coaUploadBtn" data-i18n="coaUploadBtn"></button>
    </div>
  </div>
    </main>
    <footer>회계관리 · China Branch Accounting Consolidation</footer>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="js/config.js?v=202609181643"></script>
<script src="vendor/supabase.js"></script>
<script src="js/i18n.js?v=202609181643"></script>
<script src="js/common.js?v=202609181643"></script>
<script src="vendor/xlsx.full.min.js"></script>
<script src="js/app-admin.js?v=202609181643"></script>
</body>
</html>
