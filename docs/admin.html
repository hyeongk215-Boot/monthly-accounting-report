<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>회계관리</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <h1 data-i18n="appTitle">회계관리</h1>
  <div style="display:flex; align-items:center; gap:18px; flex-wrap:wrap;">
    <nav class="nav-links">
      <a href="index.html" data-i18n="backBtn">← 뒤로</a>
    </nav>
    <div class="lang-switch">
      <button class="lang-btn" data-lang="ko">한국어</button>
      <button class="lang-btn" data-lang="zh">中文</button>
    </div>
  </div>
</header>
<main>
  <div class="card">
    <h2 data-i18n="adminHeading"></h2>
    <p class="desc" data-i18n="adminDesc"></p>
    <div class="form-grid">
      <div>
        <label data-i18n="adminKeyLabel"></label>
        <input type="password" id="adminKey">
      </div>
      <div>
        <label data-i18n="adminYm"></label>
        <select id="adminYm"></select>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn-primary" id="fetchBtn" data-i18n="adminFetch"></button>
    </div>

    <div class="btn-row" style="align-items:center;">
      <span data-i18n="adminMonthStatus"></span>:
      <span class="badge" id="monthStatusBadge"></span>
      <button class="btn-danger" id="closeMonthBtn"></button>
    </div>

    <div class="tab-bar" style="margin-top:22px;">
      <button class="tab-btn tab-active" id="viewByOfficeBtn" data-i18n="viewByOffice"></button>
      <button class="tab-btn" id="viewConsolidatedBtn" data-i18n="viewConsolidated"></button>
    </div>

    <div id="byOfficeSection">
      <h3 data-i18n="adminStatusHeading" style="font-size:15px; margin-top:22px;"></h3>
      <p class="desc" data-i18n="adminFilterHint" style="margin-bottom:6px;"></p>
      <div class="status-grid" id="statusGrid"></div>
      <div class="btn-row" id="filterAllWrap" style="display:none;">
        <button class="btn-secondary" id="filterAllBtn" data-i18n="adminFilterAll"></button>
      </div>

      <h3 data-i18n="rateSectionHeading" style="font-size:15px; margin-top:22px;"></h3>
      <div class="rate-box">
        <span data-i18n="rateCurrentLabel"></span>: <b id="currentRate">-</b>
        <input type="number" step="0.01" id="rateInput" data-i18n-placeholder="rateInputLabel" style="max-width:220px;">
        <button class="btn-secondary" id="setRateBtn" data-i18n="rateSetBtn"></button>
      </div>

      <h3 data-i18n="aggHeading" style="font-size:15px; margin-top:22px;"></h3>
      <div class="summary-bar">
        <div><span data-i18n="totalRows"></span>: <b id="totalRows">0</b></div>
      </div>
      <div class="table-wrap">
        <table class="exp-table" id="previewTable">
          <thead>
            <tr>
              <th>#</th>
              <th data-i18n="colCorp"></th>
              <th data-i18n="colOffice"></th>
              <th data-i18n="colStatementType"></th>
              <th data-i18n="colAccount"></th>
              <th data-i18n="colAmountCny"></th>
              <th data-i18n="colAmountKrw"></th>
              <th data-i18n="colSubmittedBy"></th>
              <th data-i18n="colSubmittedAt"></th>
              <th><span data-i18n="colDelete"></span> <input type="checkbox" id="selectAllCheckbox"></th>
            </tr>
          </thead>
          <tbody id="previewBody"></tbody>
        </table>
      </div>
      <div class="btn-row">
        <button class="btn-primary" id="downloadBtn" data-i18n="adminDownload"></button>
        <button class="btn-danger" id="deleteSelectedBtn" data-i18n="adminDeleteSelectedBtn"></button>
      </div>
    </div>

    <div id="consolidatedSection" style="display:none;">
      <p class="desc" data-i18n="consolidatedDesc" style="margin-top:22px;"></p>
      <div class="form-grid">
        <div>
          <label data-i18n="corp"></label>
          <select id="consolCorp"></select>
        </div>
      </div>
      <div class="btn-row">
        <button class="btn-primary" id="consolFetchBtn" data-i18n="adminFetch"></button>
      </div>
      <div class="table-wrap">
        <table class="exp-table" id="consolTable">
          <thead>
            <tr>
              <th data-i18n="colStatementType"></th>
              <th data-i18n="colAccount"></th>
              <th data-i18n="colAmountCny"></th>
              <th data-i18n="colAmountKrw"></th>
              <th data-i18n="consolidatedOfficeCount"></th>
            </tr>
          </thead>
          <tbody id="consolBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="card">
    <h2 data-i18n="coaHeading" style="font-size:18px;"></h2>
    <p class="desc" data-i18n="coaDesc"></p>
    <div class="note-box" id="coaAdminOnlyNote" data-i18n="coaSystemAdminOnly" style="display:none;"></div>
    <div class="btn-row" style="align-items:center;">
      <button class="btn-secondary" id="coaTemplateBtn" data-i18n="coaDownloadTemplateBtn"></button>
      <input type="file" id="coaFile" accept=".xlsx">
      <button class="btn-primary" id="coaUploadBtn" data-i18n="coaUploadBtn"></button>
    </div>
  </div>
</main>
<footer>회계관리 · China Branch Accounting Consolidation</footer>
<div class="toast" id="toast"></div>

<script src="js/config.js"></script>
<script src="vendor/supabase.js"></script>
<script src="js/i18n.js"></script>
<script src="js/common.js"></script>
<script src="vendor/xlsx.full.min.js"></script>
<script src="js/app-admin.js"></script>
</body>
</html>
